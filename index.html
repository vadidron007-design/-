<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Расписание УИФ</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Верхняя панель -->
    <header class="topbar">

        <div class="header-title">
            <h1>Расписание УИФ</h1>
            <p>Учебное расписание</p>
        </div>

        <button
            id="themeToggle"
            class="theme-button"
            type="button"
            aria-label="Переключить тему"
        >
            🌙
        </button>

    </header>


    <main class="container">

        <!-- Управление расписанием -->
        <section class="controls">

            <div class="control-item">

                <label for="groupSelect">
                    Группа
                </label>

                <select id="groupSelect">
                    <option value="">Загрузка...</option>
                </select>

            </div>


            <div class="control-item">

                <label for="dateSelect">
                    Дата
                </label>

                <input
                    type="date"
                    id="dateSelect"
                >

            </div>

        </section>


        <!-- Кнопки переключения дня -->
        <section class="navigation">

            <button
                id="prevDay"
                type="button"
                class="nav-button"
            >
                ← Предыдущий день
            </button>


            <button
                id="todayBtn"
                type="button"
                class="today-button"
            >
                Сегодня
            </button>


            <button
                id="nextDay"
                type="button"
                class="nav-button"
            >
                Следующий день →
            </button>

        </section>


        <!-- Информация о выбранной дате -->
        <section class="date-info">

            <h2 id="currentDate">
                Загрузка...
            </h2>

            <p id="currentGroup">
                Загрузка...
            </p>

        </section>


        <!-- Таймер -->
        <section
            id="countdown"
            class="countdown"
        >
            Загрузка...
        </section>


        <!-- Расписание -->
        <section
            id="schedule"
            class="schedule"
        >

            <div class="loading">
                Загрузка расписания...
            </div>

        </section>

    </main>


    <!-- Нижняя часть страницы -->
    <footer class="footer">

        <p>
            Расписание УИФ
        </p>

        <p class="footer-small">
            Данные учебного расписания
        </p>

    </footer>


    <!-- Основной JavaScript -->
    <script src="app.js"></script>

</body>
</html>
